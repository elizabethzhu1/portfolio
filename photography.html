<!DOCTYPE html>
<html lang="en">

<head>

    <title>Photography | Elizabeth Zhu</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body style="background-color:#113023;font-family:Georgia, 'Times New Roman', Times, serif" class="min-h-screen">
    <div class="text-white p-4 sm:absolute sm:top-10 sm:right-10 flex flex-row gap-3 justify-center sm:justify-end">
        <a href="index.html" class="hover:underline underline-offset-2"> About </a>

    <main class="photography-page px-6 pt-16 pb-10 sm:pt-28">
        <section class="photography-hero">
            <h1 class="ml7">

                    <span class="letters text-green-200 text-3xl sm:text-5xl md:text-6xl lg:text-7xl">Photography</span>

                class="photography-frame"
                src="https://photography-portfolio-plum-nu.vercel.app/main.html"

                referrerpolicy="no-referrer-when-downgrade">
